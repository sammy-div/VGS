<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Studies — Vatous Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{vgblue:'#071B78',vgblue2:'#537AD2',vgteal:'#14D3C7',vgbg:'#171717'},fontFamily:{head:['Inter','sans-serif'],body:['Inter','sans-serif']}}}};</script>
  <link rel="stylesheet" href="../assets/css/styles.css?v=2" />
</head>
<body class="font-body">
  <div class="vg-bg" aria-hidden="true"></div>
  <div class="flex min-h-screen">
    <aside id="admin-sidebar" class="fixed lg:static z-50 w-64 shrink-0 h-screen lg:h-auto bg-[#080C1C] border-r border-white/8 flex flex-col transition-transform -translate-x-full lg:translate-x-0"></aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header id="admin-topbar" data-title="Case Studies" class="sticky top-0 z-40 h-16 flex items-center gap-3 px-5 bg-[#080C1C]/90 backdrop-blur border-b border-white/8"></header>
      <main class="p-5 md:p-8 flex-1">
        <div class="flex items-center justify-between mb-5"><p class="text-soft text-sm">4 case studies.</p><button class="btn btn-primary" data-save="New case study created (demo).">＋ New case study</button></div><div class="space-y-3"><div class="admin-card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-lg bg-gradient-to-br from-vgblue/40 to-vgbg border border-white/8"></div><div class="flex-1"><p class="font-semibold text-sm">Loan operations: 9 days to 2</p><p class="text-mute text-xs">Financial services</p></div><span class="pill pill-live">Published</span><button class="btn btn-ghost !py-1.5 !px-3 text-xs" data-save="Opened (demo).">Edit</button></div>
<div class="admin-card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-lg bg-gradient-to-br from-vgblue/40 to-vgbg border border-white/8"></div><div class="flex-1"><p class="font-semibold text-sm">Records across six clinics</p><p class="text-mute text-xs">Healthcare</p></div><span class="pill pill-live">Published</span><button class="btn btn-ghost !py-1.5 !px-3 text-xs" data-save="Opened (demo).">Edit</button></div>
<div class="admin-card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-lg bg-gradient-to-br from-vgblue/40 to-vgbg border border-white/8"></div><div class="flex-1"><p class="font-semibold text-sm">AI assistant for dispatch</p><p class="text-mute text-xs">Logistics</p></div><span class="pill pill-live">Published</span><button class="btn btn-ghost !py-1.5 !px-3 text-xs" data-save="Opened (demo).">Edit</button></div>
<div class="admin-card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-lg bg-gradient-to-br from-vgblue/40 to-vgbg border border-white/8"></div><div class="flex-1"><p class="font-semibold text-sm">Inventory in sync across channels</p><p class="text-mute text-xs">Retail</p></div><span class="pill pill-live">Published</span><button class="btn btn-ghost !py-1.5 !px-3 text-xs" data-save="Opened (demo).">Edit</button></div></div>
      </main>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>

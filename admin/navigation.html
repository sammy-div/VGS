<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navigation — Vatous Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{vgblue:'#071B78',vgblue2:'#537AD2',vgteal:'#14D3C7',vgbg:'#F7F8FA'},fontFamily:{head:['Sora','Inter','sans-serif'],body:['Inter','sans-serif'],ui:['Manrope','Inter','sans-serif']}}}};</script>
  <link rel="stylesheet" href="../assets/css/styles.css?v=3" />
</head>
<body class="font-body">
  <div class="vg-bg" aria-hidden="true"></div>
  <div class="flex min-h-screen">
    <aside id="admin-sidebar" class="fixed lg:static z-50 w-64 shrink-0 h-screen lg:h-auto bg-[#FFFFFF] border-r border-[#0F172A]/8 flex flex-col transition-transform -translate-x-full lg:translate-x-0"></aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header id="admin-topbar" data-title="Navigation" class="sticky top-0 z-40 h-16 flex items-center gap-3 px-5 bg-[#FFFFFF]/90 backdrop-blur border-b border-[#0F172A]/8"></header>
      <main class="p-5 md:p-8 flex-1">
        <div class="flex items-center justify-between mb-5"><p class="text-soft text-sm">Drag to reorder the primary navigation.</p><button class="btn btn-primary" data-save="Nav item added (demo).">＋ Add item</button></div>
<div data-sortable class="space-y-3"><div draggable="true" class="admin-card p-4 flex items-center gap-4 cursor-grab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-mute"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <input class="field !py-2 flex-1" value="About" /><input class="field !py-2 flex-1 text-mute" value="about.html" />
      <button class="text-mute hover:text-red-400 p-2" aria-label="Remove" data-save="Item removed (demo).">✕</button></div>
<div draggable="true" class="admin-card p-4 flex items-center gap-4 cursor-grab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-mute"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <input class="field !py-2 flex-1" value="Services" /><input class="field !py-2 flex-1 text-mute" value="services.html" />
      <button class="text-mute hover:text-red-400 p-2" aria-label="Remove" data-save="Item removed (demo).">✕</button></div>
<div draggable="true" class="admin-card p-4 flex items-center gap-4 cursor-grab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-mute"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <input class="field !py-2 flex-1" value="Industries" /><input class="field !py-2 flex-1 text-mute" value="industries.html" />
      <button class="text-mute hover:text-red-400 p-2" aria-label="Remove" data-save="Item removed (demo).">✕</button></div>
<div draggable="true" class="admin-card p-4 flex items-center gap-4 cursor-grab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-mute"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <input class="field !py-2 flex-1" value="Case Studies" /><input class="field !py-2 flex-1 text-mute" value="case-studies.html" />
      <button class="text-mute hover:text-red-400 p-2" aria-label="Remove" data-save="Item removed (demo).">✕</button></div>
<div draggable="true" class="admin-card p-4 flex items-center gap-4 cursor-grab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-mute"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <input class="field !py-2 flex-1" value="Insights" /><input class="field !py-2 flex-1 text-mute" value="blog.html" />
      <button class="text-mute hover:text-red-400 p-2" aria-label="Remove" data-save="Item removed (demo).">✕</button></div>
<div draggable="true" class="admin-card p-4 flex items-center gap-4 cursor-grab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-mute"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <input class="field !py-2 flex-1" value="Careers" /><input class="field !py-2 flex-1 text-mute" value="careers.html" />
      <button class="text-mute hover:text-red-400 p-2" aria-label="Remove" data-save="Item removed (demo).">✕</button></div></div><div class="flex gap-3 mt-6"><button class="btn btn-primary" data-save="Changes saved.">Save changes</button><button class="btn btn-ghost" data-reset>Reset</button></div>
      </main>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
